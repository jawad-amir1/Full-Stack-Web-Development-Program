<!DOCTYPE html>
<html >
<head>
    <title>Fieldset </title>
</head>
<body>
    <fieldset style="background-color: rgba(248, 222, 195, 0.856);">
        <legend> Personal Information</legend>
        <input />
        <label>Username</label>
        <input type="text" />
        <label>Father Name</label>
        <input />
        <label>Email</label>
        <input />
        <label>Age</label>
        <input type="number" min="18" max="50" />
        <label>Birthdate</label>
        <input type="date" />
        <label>Password</label>
        <input type="password" />
        <br />
        <br />
        <label>Gender</label>
        <input type="radio" name="Gender" />
        <label>Male</label>
        <input type="radio" name="Gender" />
        <label>Female</label>
        <!-- <input type="checkbox" /> -->
        <!-- <input type="radio" /> -->
        <input type="time" />
        <input type="color" />
    </fieldset>
</body>
</html>
