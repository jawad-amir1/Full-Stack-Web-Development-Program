<!DOCTYPE html>
<html>
<head>
    <title>Weightlifting Form</title>
</head>
<body>
    <fieldset style="width: 90%; background-color: rgb(240, 171, 171);">
        <legend style="color: rgb(0, 0, 0);">Adthlitic</legend>
        <fieldset style="width: 90%; background-color: rgba(226, 36, 36, 0.521);">
            <legend>Personal Informatin</legend>
            <br>
            <label>ID</label>
            <input type="number" maxlength="3" placeholder="ID number" />
            <label>name</label>
            <input type="text" placeholder="Type your name" />
            <label>Father Name</label>
            <input type="text" placeholder="Type your father name" maxlength="15"  />
            <label>phone Namber</label>
            <input type="number" placeholder="Type your phone number" />
            <br />
            <label>Weight</label>
            <input type="number" max="400" min="50" placeholder="Kg" />
            <label>Age</label>
            <input type="number" min="18" max="60" />
            <label>Height</label>
            <input type="number" min="40" max="220" placeholder="cm" />
            <label>time</label>
            <input type="time" />
        </fieldset>
        <br />
        <fieldset style="background-color: rgb(109, 218, 218); width: 90%;">
            <legend>Club Payment</legend>
            <br>
            <label>Prices In a Month</label>
            <select>
                <option disabled selected>....</option>
                <option>Full Time 1000af</option>
                <option>Half Time 500af</option>
                <option> an hour 30af</option>
            </select>
            <label>Amount</label>
            <input type="number" />
            <label>Reminder</label>
            <input type="number" />
            <label>Date</label>
            <input type="date" />
        </fieldset>
        <label>suggestion</label>
        <br />
        <textarea placeholder="If you have any suggestion, you can type here." style="width: 90%;"></textarea>
        <br />
        <button>Recored</button>
    </fieldset>
</body>
</html>
